services:
  # Servidor Ollama (um só modelo para os agentes de análise e de chat)
  ollama:
    image: ollama/ollama:latest
    container_name: tutor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      # Intervalo curto: o "up" só segue quando o Ollama fica saudável.
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Baixa o modelo uma única vez (fica salvo no volume ollama_models)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: tutor-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    # Com OLLAMA_API_KEY o modelo roda no Ollama Cloud e não precisa ser baixado.
    command:
      - |
        [ -n "$$OLLAMA_API_KEY" ] || ollama show ${OLLAMA_MODEL:-llama3.1} >/dev/null 2>&1 || ollama pull ${OLLAMA_MODEL:-llama3.1}
    restart: "no"

  # Aplicação Streamlit (o agente inicia o servidor MCP via stdio dentro deste container)
  app:
    build: .
    container_name: tutor-app
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      HF_EMBED_MODEL: ${HF_EMBED_MODEL:-Xenova/paraphrase-multilingual-MiniLM-L12-v2}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /app/storage/huggingface
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      DB_PATH: /app/storage/progresso.db
      CHROMA_DIR: /app/storage/.chroma
    volumes:
      - app_data:/app/storage
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_models:
  app_data:
